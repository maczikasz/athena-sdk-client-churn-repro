plugins {
    id 'java'
    id 'application'
}

group = 'com.example'
version = '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

def athenaJdbcVersion = '3.8.0'
def athenaJdbcUrl = "https://downloads.athena.us-east-1.amazonaws.com/drivers/JDBC/${athenaJdbcVersion}/athena-jdbc-${athenaJdbcVersion}-lean-jar-and-separate-dependencies-jars.zip"
def athenaJdbcZip = layout.buildDirectory.file("athena-download/athena-jdbc-${athenaJdbcVersion}.zip")
def athenaJdbcDir = layout.projectDirectory.dir("libs/athena-jdbc-${athenaJdbcVersion}")

tasks.register('downloadAthenaJdbc') {
    description = 'Downloads the AWS Athena JDBC driver (3.8.0, not on Maven Central) and unpacks it into libs/.'
    outputs.dir(athenaJdbcDir)

    doLast {
        def markerJar = athenaJdbcDir.file("athena-jdbc-${athenaJdbcVersion}.jar").asFile
        if (markerJar.exists()) {
            logger.lifecycle("Athena JDBC driver already present at ${athenaJdbcDir.asFile}")
            return
        }

        def zipFile = athenaJdbcZip.get().asFile
        zipFile.parentFile.mkdirs()
        logger.lifecycle("Downloading Athena JDBC driver from ${athenaJdbcUrl}")
        new URL(athenaJdbcUrl).withInputStream { input ->
            zipFile.withOutputStream { output -> output << input }
        }

        def digest = java.security.MessageDigest.getInstance('SHA-256')
        zipFile.withInputStream { input ->
            def buffer = new byte[8192]
            int read
            while ((read = input.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
        def sha256 = digest.digest().collect { String.format('%02x', it) }.join()
        logger.lifecycle("Downloaded zip sha256: ${sha256}")

        athenaJdbcDir.asFile.mkdirs()
        copy {
            from(zipTree(zipFile))
            into(athenaJdbcDir)
        }
        logger.lifecycle("Athena JDBC driver unpacked into ${athenaJdbcDir.asFile}")
    }
}

compileJava.dependsOn(downloadAthenaJdbc)

// The download zip is "lean jar and separate dependencies jars": the driver jar plus every
// transitive AWS SDK v2 / Netty jar it needs, unshaded, under runtime-dependencies/.
dependencies {
    implementation fileTree(dir: "libs/athena-jdbc-${athenaJdbcVersion}", include: ['*.jar', 'runtime-dependencies/*.jar'])
    implementation 'com.zaxxer:HikariCP:7.1.0'
    // Same versions Develocity mcp-server ships: the health probe is a Reactor Mono.timeout over a
    // jOOQ fetch, so the scenario needs the real cancellation and close semantics of both.
    implementation 'io.projectreactor:reactor-core:3.8.7'
    implementation 'org.jooq:jooq:3.21.6'
    implementation 'org.slf4j:slf4j-simple:2.0.16'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// HealthCheckSoakTest: the soak as a JUnit test that FAILS when the event loop wedges, so it can
// be run with IntelliJ's "Repeat: Until Failure" or @RepeatedTest. Pass -Psoak.<name>=<value> as
// for runSoak. ActiveProcessorCount=1 gives the production pod's two-loop SDK group.
tasks.named('test', Test) {
    useJUnitPlatform()
    failFast = true // @RepeatedTest stops at the first wedge, like IntelliJ's Repeat: Until Failure
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    jvmArgs '-XX:ActiveProcessorCount=1'
    project.properties.findAll { it.key.startsWith('soak.') }.each { k, v -> systemProperty k, v }
    testLogging { events 'passed', 'failed'; exceptionFormat 'full'; showStandardStreams = false }
    outputs.upToDateWhen { false }
}

application {
    mainClass = 'com.example.athenachurn.streaming.StreamingResponseStallRepro'
}

tasks.named('run') {
    dependsOn(downloadAthenaJdbc)
}

tasks.register('runResultFetcherWorkaround', JavaExec) {
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    description = 'Runs the ResultFetcher=GetQueryResults workaround scenario (Workaround A).'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.athenachurn.streaming.ResultFetcherWorkaroundRepro'
    dependsOn(downloadAthenaJdbc)
}

tasks.register('runTimeoutInterrupt', JavaExec) {
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    description = 'Runs the production-shaped onset: Reactor timeout interrupts a jOOQ/Hikari Athena fetch while the query is still RUNNING; sweeps how late the query completes.'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.athenachurn.streaming.TimeoutInterruptRepro'
    dependsOn(downloadAthenaJdbc)
    if (project.hasProperty('completionDelaysMillis')) {
        args project.property('completionDelaysMillis')
    }
    // -Pphases=C -Ptrials=5 runs only the eviction race, repeatedly, and stops at the first wedge.
    ['phases', 'trials'].each { name ->
        if (project.hasProperty(name)) {
            systemProperty name, project.property(name)
        }
    }
}

tasks.register('runSoak', JavaExec) {
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    description = 'Soaks the mcp-server health probe on the incident-build pool config against a randomly slow mock Athena; Hikari at DEBUG logs every close reason.'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.athenachurn.streaming.HealthCheckSoakRepro'
    dependsOn(downloadAthenaJdbc)
    // The production pod had 2 event loops in the shared SDK group; 1 CPU gives the same shape.
    jvmArgs '-XX:ActiveProcessorCount=1'
    systemProperty 'org.slf4j.simpleLogger.log.com.zaxxer.hikari', 'debug'
    systemProperty 'org.slf4j.simpleLogger.showDateTime', 'true'
    systemProperty 'org.slf4j.simpleLogger.dateTimeFormat', 'HH:mm:ss.SSS'
    // Pass -Psoak.<name>=<value> through as system properties (seconds, probabilities, thread counts).
    project.properties.findAll { it.key.startsWith('soak.') }.each { k, v -> systemProperty k, v }
}

tasks.register('runChurn', JavaExec) {
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    description = 'Runs the offline SDK client construction churn reproduction (Finding 2).'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.athenachurn.churn.AthenaClientChurnRepro'
    dependsOn(downloadAthenaJdbc)
}
